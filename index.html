<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,sans-serif;color:var(--txt);background:radial-gradient(circle at 20% 0%,#A855F7 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));min-height:100vh}

.wa{background:#25d366!important;color:#fff!important}
h1{font-size:44px;font-weight:900;margin:8px 0 0;text-align:center;letter-spacing:1px}
h1 span{color:var(--y)}
.sub{text-align:center;color:var(--mut);margin:0 0 20px;font-weight:600}
h2{font-size:22px;margin:6px 0 14px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(6px)}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px 14px;font:800 19px Cairo,sans-serif;color:#2b0f4c;background:var(--y);margin:10px 0;cursor:pointer;box-shadow:0 5px 0 #0003;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn.b{background:var(--b)}.btn.g{background:var(--g)}.btn.o{background:var(--o)}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45}
input{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:#0003;color:#fff;font:700 18px Cairo,sans-serif;outline:none;text-align:center}
input:focus{border-color:var(--y)}
.row{display:flex;gap:10px}.row>*{flex:1}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cat{font-size:14px!important;padding:10px 4px!important}
.banner{text-align:center;font-weight:900;font-size:18px;padding:10px;border-radius:16px;margin:8px 0;background:linear-gradient(90deg,#ff9f1c,#ff5d73);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.03)}}
.jokers{display:flex;gap:8px;margin:12px 0}.jk{flex:1;border:2px dashed var(--y);background:#ffd23f18;color:#fff;border-radius:14px;padding:10px 4px;font:800 15px Cairo;cursor:pointer}.jk.used{opacity:.3;border-style:solid}.jk.on{background:var(--y);color:#2b0f4c}
.cat{border:2px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;font-weight:800;font-size:16px;cursor:pointer;background:#0002;user-select:none}
.cat .e{font-size:28px;display:block}
.ai{font-size:12px;background:#4cc9f033;border:1px solid #4cc9f088;border-radius:99px;padding:2px 8px;margin-inline-start:6px}
.status{font-size:13px;text-align:center;color:var(--mut);margin-top:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}.sw{width:54px;height:30px;border-radius:99px;background:#0005;position:relative;flex:none;cursor:pointer;border:2px solid var(--line)}.sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on i{right:27px}
.cat.on{border-color:var(--y);background:#ffd23f22}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:99px;border:2px solid var(--line);font-weight:800;cursor:pointer}
.pill.on{background:var(--y);color:#2b0f4c;border-color:var(--y)}
.code{font-size:52px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--y);direction:ltr;margin:4px 0}
.players{list-style:none;padding:0;margin:0}
.players li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:#0002;margin:6px 0;font-weight:700}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--y);color:#2b0f4c;font-weight:800;margin-inline-start:6px}
.tag.me{background:var(--b)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-weight:700;margin-bottom:10px}
.qcat{display:inline-block;background:#0003;border-radius:99px;padding:4px 14px;font-weight:800;font-size:15px}
.timer{height:10px;border-radius:99px;background:#0004;overflow:hidden;margin:10px 0 16px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r));border-radius:99px;transition:width .25s linear}
.prompt{text-align:center;padding:20px 8px;font-weight:900;line-height:1.5}
.prompt .lbl{display:block;font-size:16px;color:var(--mut);font-weight:700;margin-bottom:6px}
.prompt .big{font-size:40px}.prompt .flag{font-size:110px;line-height:1.1}
.prompt .q{font-size:24px}.prompt .clue{font-size:22px}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:18px;padding:16px;font:800 19px Cairo,sans-serif;color:#fff;cursor:pointer;text-align:center;box-shadow:0 5px 0 #0003}
.opt:nth-child(1){background:#e63946}.opt:nth-child(2){background:#1d4ed8}.opt:nth-child(3){background:#d97706}.opt:nth-child(4){background:#059669}
.opt.picked{outline:4px solid #fff}
.opt.dim{opacity:.35}
.opt.right{outline:4px solid var(--y);opacity:1}
.msg{text-align:center;font-weight:800;font-size:20px;margin:14px 0}
.big-emoji{font-size:70px;text-align:center}
.board li:first-child{background:#ffd23f33}
.pts{color:var(--y);font-weight:900}
.plus{color:var(--g);font-size:14px;margin-inline-start:6px}
.note{color:var(--mut);font-size:14px;text-align:center;line-height:1.7}
.back{background:none;border:0;color:var(--mut);font:700 15px Cairo;cursor:pointer;padding:4px 0}
.teams input{margin:6px 0}

body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(130deg,#4a1260,#8E2A7E,#EC4899,#F97316,#4a1260);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#floaters{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#floaters span{position:absolute;bottom:-60px;font-size:28px;opacity:.35;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg)}}
.card{background:#ffffff1f;box-shadow:0 10px 30px #0003}
h1{text-shadow:0 4px 0 #0004,0 0 30px #ffd23f88;animation:wobble 3s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}
.enter>*{animation:slideIn .45s cubic-bezier(.2,1.4,.4,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}
@keyframes slideIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.enter .opt{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.enter .opt:nth-child(2){animation-delay:.08s}.enter .opt:nth-child(3){animation-delay:.16s}.enter .opt:nth-child(4){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.enter .prompt .flag,.enter .prompt .big{display:inline-block;animation:bounceIn .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes bounceIn{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.opt.right{animation:glow .6s ease 3 alternate}
@keyframes glow{to{transform:scale(1.05);box-shadow:0 0 30px var(--y)}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
#flash.ok{background:radial-gradient(circle,#2ee59d66,transparent 70%);animation:fl .7s}
#flash.bad{background:radial-gradient(circle,#ff5d7366,transparent 70%);animation:fl .7s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.floatpts{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font:900 54px Cairo;color:var(--y);text-shadow:0 4px 0 #0005;pointer-events:none;z-index:70;animation:rise 1.3s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,30px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-120px) scale(1)}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#3a0ca3,#f72585);transition:opacity .5s}
#splash .logo{font:900 72px Cairo;color:#fff;animation:bounceIn 1s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 6px 0 #0004}
#splash .fire{font-size:90px;animation:wobble 1s infinite}
#splash.hide{opacity:0;pointer-events:none}
#vcBar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;z-index:85;display:none;gap:8px;align-items:center}
#vcBar.show{display:flex}
body.vc #app{padding-bottom:96px}
#vcBar button{border:1px solid var(--line);color:#fff;border-radius:99px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 20px #0006}
#vcMic{height:58px;min-width:58px;padding:0 18px;font-size:17px;background:#5B1A6E}
#vcMic.on{background:var(--g);color:#11331f}
#vcMic.mu{background:var(--r)}
#vcMic.talk{box-shadow:0 0 0 5px #2ee59d66,0 6px 20px #0006}
#vcOff{width:40px;height:40px;background:#0007;font-size:15px}
#vcInfo{font-size:12px;background:#0007;padding:4px 10px;border-radius:99px;color:var(--mut)}
.vci{font-size:16px;opacity:.85;transition:.15s}
.vci.talk{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 6px #2ee59d)}
.sound{position:fixed;top:12px;left:12px;z-index:80;background:#0004;border:1px solid var(--line);color:#fff;border-radius:99px;width:42px;height:42px;font-size:20px;cursor:pointer}
.timer.hurry i{animation:hurry .5s infinite alternate}
@keyframes hurry{to{filter:brightness(1.6)}}
.btn{transition:transform .08s,filter .2s}.btn:hover{filter:brightness(1.08)}
.scene{font-size:19px!important;line-height:1.7}

.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.game{border-radius:22px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 8px 0 #0003,0 12px 30px #0003;transition:transform .1s;position:relative;overflow:hidden}
.game:active{transform:translateY(4px);box-shadow:0 3px 0 #0003}
.game .ge{font-size:46px;display:block;animation:wobble 3s ease-in-out infinite}
.game b{font-size:18px;display:block}.game small{font-size:12px;opacity:.85;font-weight:700}
.game.g1{background:linear-gradient(140deg,#F97316,#EC4899)}.game.g2{background:linear-gradient(140deg,#7C2D92,#A855F7)}.game.g3{background:linear-gradient(140deg,#EC4899,#BE185D)}.game.g4{background:linear-gradient(140deg,#FBBF24,#F97316)}
.game .new{position:absolute;top:8px;left:8px;background:#fff;color:#f72585;font-size:11px;font-weight:900;border-radius:99px;padding:1px 8px}
.hero-mini{font-size:64px;text-align:center;animation:bounceIn .8s cubic-bezier(.2,1.8,.4,1) both}
.flipcard{text-align:center;padding:40px 16px!important;cursor:pointer;border:3px dashed var(--y)!important}

.gword{display:inline-flex;gap:4px;direction:rtl}

.gkb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl;margin:12px 0}
.gk{border:0;border-radius:12px;padding:11px 0;font:800 20px Cairo;background:#ffffff26;color:#fff;cursor:pointer;box-shadow:0 3px 0 #0003}
.gk.hit{background:var(--g);color:#0b3}.gk.hit{color:#063}.gk.miss{background:#0004;color:#fff5}
.snwrap{position:relative;display:flex;justify-content:center;margin:6px 0 12px}
#snC{border-radius:18px;background:#1a0638aa;box-shadow:0 10px 30px #0005;touch-action:none}
.snover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b0f4ccc;border-radius:18px;text-align:center;padding:20px}
.dpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;direction:ltr}
.dpad button{height:58px;border:0;border-radius:16px;font-size:26px;background:#ffffff26;box-shadow:0 4px 0 #0003;cursor:pointer}
.dpad button:active{transform:translateY(3px)}
/* افتتاحية */
#splash{overflow:hidden;background:radial-gradient(circle at 50% 45%,#F97316,#EC4899 45%,#5B1A6E)!important}
#splash .rays{position:absolute;width:220vmax;height:220vmax;background:repeating-conic-gradient(from 0deg,#ffffff14 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splash .burst span{position:absolute;left:50%;top:45%;font-size:38px;opacity:0;animation:burst 1.6s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(.35s + var(--i)*.07s)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}

#splash .logo{position:relative;font-size:84px!important;animation:bounceIn 1s .25s cubic-bezier(.2,1.8,.4,1) both!important;text-shadow:0 6px 0 #0005,0 0 40px #ffd23faa!important}
#splash .tag{position:relative;color:#fff;font-weight:800;font-size:18px;opacity:0;animation:slideIn .6s .9s both}

#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:99px;animation:load 2.2s .3s ease forwards}
@keyframes load{to{width:100%}}
#splash .skip{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));color:#fff9;font-size:14px;font-weight:700}
.credit{text-align:center;color:#ffffffcc;font-size:14px;line-height:1.8;margin:26px 0 6px;padding:16px;border-top:1px solid var(--line)}
.credit b{color:var(--y)}.cr-logo{font-weight:900;font-size:20px;color:#fff}.cr-small{font-size:12px;opacity:.75}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const revWord=w=>[...w].reverse().join('');
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function bank(k){if(k==='rev')return DATA.rev.map(w=>[revWord(w),w]);return DATA[k]||[]}

/* ---------- الأسئلة المتولّدة (حساب) ---------- */
function mathQ(){
  const t=rnd(0,3);let p,a;
  if(t===0){const x=rnd(12,89),y=rnd(12,89);p=`${x} + ${y}`;a=x+y}
  else if(t===1){const x=rnd(40,150),y=rnd(11,x-5);p=`${x} − ${y}`;a=x-y}
  else if(t===2){const x=rnd(3,13),y=rnd(3,13);p=`${x} × ${y}`;a=x*y}
  else{const y=rnd(2,12),a0=rnd(2,15);p=`${y*a0} ÷ ${y}`;a=a0}
  const w=new Set();while(w.size<3){const d=a+(Math.random()<.5?-1:1)*rnd(1,t===2?12:10);if(d!==a&&d>=0)w.add(d)}
  const o=shuffle([a,...w].map(String));return {k:'math',p:p+' = ؟',o,c:o.indexOf(String(a))};
}

/* ---------- بناء سؤال باختيارات ---------- */
function makeQ(k,it,ai){
  let wrong=it[2];
  if(!wrong||wrong.length<3){
    const pool=[...new Set([...bank(k),...(AIPOOL[k]||[])].map(x=>x[1]))].filter(a=>a!==it[1]);
    wrong=shuffle(pool).slice(0,3);
  }
  const o=shuffle([it[1],...wrong.slice(0,3)]);
  return {k,p:it[0],o,c:o.indexOf(it[1]),ai:!!ai};
}

/* ================== محرّك الأسئلة اللانهائي ================== */
let sampleFn=null, aiOn=store.get('wl_ai',true), aiStatus='', aiCount=0, aiFail=false;
const DECK={}, AIPOOL={}, aiQueue=[], inflight=new Set();
let seen=new Set(store.get('wl_seen',[]));
function markSeen(p){seen.add(p);if(seen.size>800)seen=new Set([...seen].slice(-600));store.set('wl_seen',[...seen])}
function deck(k){
  if(!DECK[k]){const b=shuffle(bank(k));DECK[k]={ai:[],bank:[...b.filter(x=>!seen.has(x[0])),...b.filter(x=>seen.has(x[0]))]}}
  return DECK[k];
}
const aiReady=()=>!!(sampleFn&&aiOn&&!aiFail);
function wantMore(k){
  if(!aiReady()||!CATS[k].ai)return;
  const d=deck(k);
  if(d.ai.length<4&&!inflight.has(k)&&!aiQueue.includes(k)){aiQueue.push(k);pumpAI()}
}
let pumping=false;
async function pumpAI(){
  if(pumping)return;pumping=true;
  while(aiQueue.length&&aiReady()){
    const k=aiQueue.shift();inflight.add(k);setAI('🤖 بيجهّز أسئلة '+CATS[k].t+' جديدة...');
    try{const items=await genAI(k);const d=deck(k);items.forEach(x=>d.ai.push(x));(AIPOOL[k]=AIPOOL[k]||[]).push(...items);aiCount+=items.length;setAI(`🤖 ${aiCount} سؤال جديد اتولّد`)}
    catch(e){
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)){aiFail=true;setAI('الأسئلة الذكية مش متاحة هنا — شغالين بالأسئلة الجاهزة')}
      else if(e&&e.code==='rate_limited'){setAI('🤖 استراحة شوية من توليد الأسئلة...');aiQueue.length=0}
      else setAI('🤖 حصلت مشكلة صغيرة، هنكمل بالأسئلة الجاهزة');
    }
    inflight.delete(k);
  }
  pumping=false;
}
function setAI(t){aiStatus=t;const el=$('#aist');if(el)el.textContent=t}
async function genAI(k){
  const c=CATS[k];
  const avoid=[...bank(k).map(x=>c.words?x[1]:x[0]),...(AIPOOL[k]||[]).map(x=>c.words?x[1]:x[0])].slice(-60);
  const words=!!c.words;
  const prompt=words
    ?`إنت بتولّد محتوى للعبة "لمّتنا" (لعبة تحديات بين صحاب مصريين).
اكتب 15 كلمة جديدة لفئة: ${c.ai}.
ماتكررش أي كلمة من دول: ${avoid.join('، ')}
رد بـ JSON array of strings بس، مثال: ["مخدة","طرابيزة"]`
    :`إنت بتولّد أسئلة للعبة "لمّتنا" (لعبة تحديات وأسئلة بين صحاب مصريين).
الفئة: ${c.t} — ${c.ai}
اكتب 10 أسئلة جديدة متنوعة بالعامية المصرية، شوية سهلة وشوية متوسطة وشوية صعبة، وتكون ممتعة وتعمل جو.
شروط مهمة:
- الإجابة الصح لازم تكون معلومة مؤكدة 100%، ولو مش متأكد من حاجة ماتكتبهاش.
- 3 اختيارات غلط مقنعة من نفس النوع، ومحدش منهم ينفع يكون صح.
- كل نص قصير (السؤال أقل من 15 كلمة، والاختيار أقل من 6 كلمات).
- ماتكررش الأسئلة دي: ${avoid.join(' | ')}
رد بـ JSON array بس، مثال: [{"q":"نص السؤال","a":"الإجابة الصح","w":["غلط 1","غلط 2","غلط 3"]}]`;
  const res=await sampleFn.json(prompt,{cache:false});
  if(!Array.isArray(res))throw {code:'bad'};
  const clean=s=>String(s||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,120);
  let out;
  if(words){
    const have=new Set(DATA.rev.concat((AIPOOL.rev||[]).map(x=>x[1])));
    out=res.map(clean).filter(w=>w&&!/\s/.test(w)&&[...w].length>=3&&[...w].length<=10&&!have.has(w)).map(w=>[revWord(w),w]);
  }else{
    const have=new Set(avoid);
    out=res.map(x=>x&&[clean(x.q),clean(x.a),Array.isArray(x.w)?[...new Set(x.w.map(clean))].filter(v=>v&&v!==clean(x.a)):[]])
      .filter(x=>x&&x[0]&&x[1]&&x[2].length>=3&&!have.has(x[0]));
  }
  if(!out.length)throw {code:'bad'};
  return shuffle(out);
}
function draw(k){
  if(CATS[k].gen)return mathQ();
  const d=deck(k);wantMore(k);
  let it,ai=false;
  if(d.ai.length&&(Math.random()<.75||!d.bank.length)){it=d.ai.shift();ai=true}
  else{if(!d.bank.length){delete DECK[k];return draw(k)}it=d.bank.shift()}
  markSeen(it[0]);
  return makeQ(k,it,ai);
}
function warmUp(cats){cats.forEach(k=>{deck(k);wantMore(k)})}
let lastCat='';
function drawAny(cats){let k;do{k=cats[Math.floor(Math.random()*cats.length)]}while(cats.length>1&&k===lastCat);lastCat=k;return draw(k)}

/* ================== غرف أونلاين عبر MQTT (سيرفر مجاني) ================== */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const MY_PEER=Math.random().toString(36).slice(2,12);
function createRoomService(){
  if(!window.mqtt)return null;
  return {
    join(code){
      return new Promise((resolve,reject)=>{
        const base='wallaha/v1/'+code+'/p/';const myTopic=base+MY_PEER;const sigBase='wallaha/v1/'+code+'/s/';const sigL=new Set();
        let bi=0,client=null,done=false,me={},peersMap=new Map(),listeners=new Set(),hb=null,flushT=null,snapshot=[];
        const rebuild=()=>{
          const now=Date.now();
          for(const [id,p] of peersMap)if(id!==MY_PEER&&now-p.seen>30000)peersMap.delete(id);
          snapshot=[{peer:MY_PEER,presence:me,isMe:true,sameTab:true,kind:'viewer',updatedAt:now},
            ...[...peersMap].filter(([id])=>id!==MY_PEER).map(([id,p])=>({peer:id,presence:p.presence,isMe:false,sameTab:false,kind:'viewer',updatedAt:p.seen}))];
          listeners.forEach(f=>{try{f({peers:snapshot})}catch(e){}});
        };
        const send=()=>{flushT=null;if(client&&client.connected)client.publish(myTopic,JSON.stringify({ts:Date.now(),p:me}),{retain:true,qos:0})};
        const connect=()=>{
          client=mqtt.connect(BROKERS[bi],{clientId:'wl_'+MY_PEER+'_'+Math.random().toString(36).slice(2,6),clean:true,keepalive:20,reconnectPeriod:2000,connectTimeout:8000,
            will:{topic:myTopic,payload:'',retain:true,qos:0}});
          client.on('connect',()=>{
            client.subscribe(base+'+');client.subscribe(sigBase+MY_PEER);send();
            if(!done){done=true;resolve(api)}
          });
          client.on('message',(t,msg)=>{
            if(t.startsWith(sigBase)){try{const d=JSON.parse(msg.toString());if(d&&d.f&&d.f!==MY_PEER)sigL.forEach(f=>{try{f(d)}catch(e){}})}catch(e){}return}
            const id=t.slice(base.length);if(id===MY_PEER)return;
            const txt=msg.toString();
            if(!txt){peersMap.delete(id);rebuild();return}
            try{const d=JSON.parse(txt);if(Math.abs(Date.now()-(+d.ts||0))>60000&&!peersMap.has(id))return;
              if(d&&typeof d.p==='object'){peersMap.set(id,{presence:Object.freeze(d.p),seen:Date.now()});rebuild()}}catch(e){}
          });
          client.on('error',()=>{});
          setTimeout(()=>{if(!done){try{client.end(true)}catch(e){}bi++;if(bi<BROKERS.length)connect();else reject({code:'upstream_error'})}},9000);
        };
        const api={
          presence(patch){for(const k in patch){if(patch[k]===null)delete me[k];else me[k]=patch[k]}me={...me};rebuild();if(!flushT)flushT=setTimeout(send,80);return Promise.resolve()},
          peers(){return snapshot},
          onPeers(f){listeners.add(f);setTimeout(()=>f({peers:snapshot}),0);return()=>listeners.delete(f)},
          signal(to,d){if(client&&client.connected)client.publish(sigBase+to,JSON.stringify({...d,f:MY_PEER}),{qos:0})},
          onSignal(f){sigL.add(f);return()=>sigL.delete(f)},
          leave(){clearInterval(hb);try{client.publish(myTopic,'',{retain:true});setTimeout(()=>client.end(),300)}catch(e){}listeners.clear();sigL.clear();return Promise.resolve()}
        };
        hb=setInterval(()=>{send();rebuild()},10000);
        connect();
      });
    }
  };
}

const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:stun.cloudflare.com:3478'}];
const VC={on:false,muted:false,stream:null,pcs:new Map(),talk:new Set(),meters:new Map(),mt:null};
function vcPeers(){return peers().filter(p=>!p.sameTab&&p.presence.vc===1)}
async function vcJoin(){
  if(!R)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){floatPts('المتصفح ده مش بيدعم المايك 😕');return}
  try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){floatPts('لازم تسمح للمايك من إعدادات المتصفح 🎙️');return}
  VC.on=true;VC.muted=false;track('voice-join','دخل الفويس');
  vcMeter(MY_PEER,VC.stream);
  await R.presence({vc:1,mu:0});
  setTimeout(vcSync,400);vcUI();if(S.scr==='lobby')render();
}
function vcToggle(){
  ac();
  if(!VC.on){vcJoin();return}
  VC.muted=!VC.muted;VC.stream.getAudioTracks().forEach(t=>t.enabled=!VC.muted);
  R&&R.presence({mu:VC.muted?1:0});vib(20);vcUI();
}
function vcClose(id){
  const c=VC.pcs.get(id);if(!c)return;VC.pcs.delete(id);
  try{c.pc.close()}catch(e){}if(c.au){c.au.srcObject=null;c.au.remove()}
  VC.meters.delete(id);VC.talk.delete(id);
}
function vcLeave(){
  [...VC.pcs.keys()].forEach(id=>{try{R&&R.signal(id,{t:'b'})}catch(e){}vcClose(id)});
  if(VC.stream)VC.stream.getTracks().forEach(t=>t.stop());
  VC.stream=null;VC.on=false;VC.muted=false;VC.meters.clear();VC.talk.clear();
  try{R&&R.presence({vc:null,mu:null})}catch(e){}
  vcUI();
}
function vcPC(id){
  vcClose(id);
  const pc=new RTCPeerConnection({iceServers:ICE});const c={pc,au:null,q:[]};VC.pcs.set(id,c);
  VC.stream.getTracks().forEach(t=>pc.addTrack(t,VC.stream));
  pc.onicecandidate=e=>{if(e.candidate)R&&R.signal(id,{t:'c',d:e.candidate.toJSON()})};
  pc.ontrack=e=>{
    const st=e.streams[0]||new MediaStream([e.track]);
    if(!c.au){c.au=document.createElement('audio');c.au.autoplay=true;c.au.setAttribute('playsinline','');c.au.style.display='none';document.body.appendChild(c.au)}
    c.au.srcObject=st;c.au.play().catch(()=>{});vcMeter(id,st);vcUI();
  };
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='failed'||s==='closed'){if(VC.pcs.get(id)===c){vcClose(id);setTimeout(vcSync,2500)}}
    vcUI();
  };
  return c;
}
async function vcCall(id){
  const c=vcPC(id);
  setTimeout(()=>{if(VC.pcs.get(id)===c&&c.pc.connectionState!=='connected'){vcClose(id);vcSync()}},15000);
  try{const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);R.signal(id,{t:'o',d:c.pc.localDescription.toJSON()})}catch(e){vcClose(id)}
}
async function vcSignal(m){
  if(!VC.on||!R)return;const id=m.f;
  try{
    if(m.t==='o'){
      const c=vcPC(id);await c.pc.setRemoteDescription(m.d);
      for(const x of c.q)await c.pc.addIceCandidate(x).catch(()=>{});c.q=[];
      const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);R.signal(id,{t:'a',d:c.pc.localDescription.toJSON()});
    }else if(m.t==='a'){
      const c=VC.pcs.get(id);if(!c||c.pc.signalingState!=='have-local-offer')return;
      await c.pc.setRemoteDescription(m.d);for(const x of c.q)await c.pc.addIceCandidate(x).catch(()=>{});c.q=[];
    }else if(m.t==='c'){
      const c=VC.pcs.get(id);if(!c)return;
      if(c.pc.remoteDescription)await c.pc.addIceCandidate(m.d).catch(()=>{});else c.q.push(m.d);
    }else if(m.t==='b'){vcClose(id);vcUI()}
  }catch(e){}
}
function vcSync(){
  if(!R||!VC.on)return;
  const want=new Set(vcPeers().map(p=>p.peer));
  for(const id of [...VC.pcs.keys()])if(!want.has(id))vcClose(id);
  // الأصغر في الـ id هو اللي بيبدأ الاتصال، عشان مايحصلش تصادم
  want.forEach(id=>{if(!VC.pcs.has(id)&&MY_PEER<id)vcCall(id)});
  vcUI();
}
function vcMeter(id,stream){
  const a=ac();if(!a)return;
  try{const an=a.createAnalyser();an.fftSize=512;a.createMediaStreamSource(stream).connect(an);VC.meters.set(id,{an,buf:new Uint8Array(an.fftSize)})}catch(e){}
  if(!VC.mt)VC.mt=setInterval(vcTick,180);
}
function vcTick(){
  if(!VC.on){clearInterval(VC.mt);VC.mt=null;return}
  const before=[...VC.talk].join();
  VC.meters.forEach((m,id)=>{m.an.getByteTimeDomainData(m.buf);let s=0;for(let i=0;i<m.buf.length;i++){const v=(m.buf[i]-128)/128;s+=v*v}
    const loud=Math.sqrt(s/m.buf.length)>0.04&&!(id===MY_PEER&&VC.muted);loud?VC.talk.add(id):VC.talk.delete(id)});
  if([...VC.talk].join()!==before){
    document.querySelectorAll('.vci').forEach(el=>el.classList.toggle('talk',VC.talk.has(el.dataset.vp)));
    const b=$('#vcMic');if(b)b.classList.toggle('talk',VC.talk.has(MY_PEER));vcInfo();
  }
}
function vcBadge(p){
  const pr=p.presence;if(pr.vc!==1)return '';

}
function vcInfo(){
  const el=$('#vcInfo');if(!el)return;
  if(!VC.on){el.style.display='none';return}
  const others=vcPeers();const ok=others.filter(p=>{const c=VC.pcs.get(p.peer);return c&&c.pc.connectionState==='connected'}).length;
  const talking=others.filter(p=>VC.talk.has(p.peer)).map(p=>p.presence.nm);
  el.style.display='';
  el.textContent=talking.length?('🗣️ '+talking.slice(0,2).join(' و ')):others.length?(ok<others.length?`بيوصّل... ${ok}/${others.length}`:`🔊 معاك ${ok}`):'مستني حد يفتح المايك';
}
function vcUI(){
  const bar=$('#vcBar');if(!bar)return;
  bar.classList.toggle('show',!!R);document.body.classList.toggle('vc',!!R);

}

function tone(f,t0,d,type='sine',v=.18){const a=ac();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function snd(n){
  if(n==='ok'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.25,'triangle'))}

let SN=null;
function snakeStart(){go('snk');setTimeout(snInit,30)}
function snk(){
  return `<div class="top"><button class="back" onclick="snStop();go('home')">→ رجوع</button><span>🍎 <b id="snS">0</b></span><span>🏆 <b id="snB">${store.get('wl_snb',0)}</b></span></div>
  <div class="snwrap"><canvas id="snC"></canvas><div id="snO" class="snover"><div class="big-emoji">🐍</div><h2>سناك</h2><p class="note">اسحب بصباعك على الشاشة أو استخدم الأسهم</p><button class="btn g" onclick="snPlay()">ابدأ ▶️</button></div></div>
  <div class="dpad"><span></span><button onclick="snDir(0,-1)">⬆️</button><span></span><button onclick="snDir(-1,0)">⬅️</button><span></span><button onclick="snDir(1,0)">➡️</button><span></span><button onclick="snDir(0,1)">⬇️</button><span></span></div>`;
}
const SN_FOOD=['🍎','🍔','🍕','🧆','🍩','🍉','🌽','🍓'];
function snInit(){
  const cv=$('#snC');if(!cv)return;const N=17;const sz=Math.min(innerWidth-36,440);const dp=devicePixelRatio||1;
  cv.width=sz*dp;cv.height=sz*dp;cv.style.width=sz+'px';cv.style.height=sz+'px';
  SN={cv,ctx:cv.getContext('2d'),N,cell:sz*dp/N,snake:[{x:8,y:8},{x:7,y:8},{x:6,y:8}],dir:{x:1,y:0},next:{x:1,y:0},food:null,score:0,speed:150,timer:null,alive:false};
  snFood();snDraw();
  let t0=null;cv.ontouchstart=e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY};e.preventDefault()};
  cv.ontouchend=e=>{if(!t0)return;const t=e.changedTouches[0];const dx=t.clientX-t0.x,dy=t.clientY-t0.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){Math.abs(dx)>Math.abs(dy)?snDir(Math.sign(dx),0):snDir(0,Math.sign(dy))}t0=null;e.preventDefault()};
}
document.addEventListener('keydown',e=>{if(S.scr!=='snk')return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();snDir(...m)}});
function snFood(){let f;do{f={x:Math.floor(Math.random()*SN.N),y:Math.floor(Math.random()*SN.N),e:SN_FOOD[Math.floor(Math.random()*SN_FOOD.length)]}}while(SN.snake.some(s=>s.x===f.x&&s.y===f.y));SN.food=f}
function snDir(x,y){if(!SN)return;if(!SN.alive){return}if(x===-SN.dir.x&&y===-SN.dir.y)return;SN.next={x,y}}
function snPlay(){track('play-snake','سناك');if(!SN)snInit();if(SN.over)snInit();$('#snO').style.display='none';SN.alive=true;snLoop()}
function snStop(){if(SN){clearTimeout(SN.timer);SN.alive=false}}
function snLoop(){
  if(!SN||!SN.alive||S.scr!=='snk')return;
  SN.dir=SN.next;const h=SN.snake[0];const nh={x:h.x+SN.dir.x,y:h.y+SN.dir.y};
  if(nh.x<0||nh.y<0||nh.x>=SN.N||nh.y>=SN.N||SN.snake.some(s=>s.x===nh.x&&s.y===nh.y)){
    SN.alive=false;SN.over=true;fxResult(false);const b=store.get('wl_snb',0);const rec=SN.score>b;if(rec){store.set('wl_snb',SN.score);setTimeout(winFx,300)}
    const o=$('#snO');o.innerHTML=`<div class="big-emoji">${rec?'🏆':'💥'}</div><h2>${rec?'رقم قياسي جديد!':'خسرت!'}</h2><p class="msg">نقطك: ${SN.score}</p><button class="btn g" onclick="snPlay()">العب تاني 🔁</button>`;o.style.display='flex';$('#snB').textContent=store.get('wl_snb',0);return}
  SN.snake.unshift(nh);
  if(nh.x===SN.food.x&&nh.y===SN.food.y){SN.score++;$('#snS').textContent=SN.score;snd('ok');vib(20);SN.speed=Math.max(70,SN.speed-4);snFood()}else SN.snake.pop();
  snDraw();SN.timer=setTimeout(snLoop,SN.speed);
}
function snDraw(){
  const {ctx,cell,N}=SN;const W=cell*N;ctx.clearRect(0,0,W,W);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2?'rgba(255,255,255,.06)':'rgba(255,255,255,.12)';ctx.fillRect(x*cell,y*cell,cell,cell)}
  ctx.font=`${cell*.85}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SN.food.e,SN.food.x*cell+cell/2,SN.food.y*cell+cell/2+cell*.05);
  SN.snake.forEach((s,i)=>{const t=i/Math.max(1,SN.snake.length-1);ctx.fillStyle=`hsl(${48-t*30},100%,${60-t*12}%)`;const r=cell*.32,p=cell*.06;
    const x=s.x*cell+p,y=s.y*cell+p,w=cell-2*p;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,w,r):ctx.rect(x,y,w,w);ctx.fill();
    if(i===0){ctx.fillStyle='#2b0f4c';const ex=SN.dir.y?cell*.22:0,ey=SN.dir.x?cell*.22:0;const cx=s.x*cell+cell/2+SN.dir.x*cell*.15,cy=s.y*cell+cell/2+SN.dir.y*cell*.15;
      [[1],[-1]].forEach(([k])=>{ctx.beginPath();ctx.arc(cx+ex*k,cy+ey*k,cell*.09,0,7);ctx.fill()})}});
}

function onlineQ(){
  const s=st();if(!s)return lobby();
  const q={k:s.k,p:s.p,o:s.o,c:s.c,ai:s.ai};const rv=s.ph==='rv';
  let res='';
  if(rv){const ok=myAns&&myAns.qi===s.qi&&myAns.i===s.c;res=`<p class="msg" style="color:${ok?'var(--g)':'var(--r)'}">${ok?'برافو عليك! ✅':myAns?'للأسف غلط ❌':'الوقت خلص ⏰'}</p><div class="card"><h2>النتيجة</h2>${scoreList(s.sc,true)}</div>${isHost?`<div class="row"><button class="btn" onclick="hostNext()">التالي ←</button><button class="btn ghost" onclick="hostEnd()">إنهاء</button></div>`:''}`}
  else if(myAns)res=`<p class="msg">جاوبت! مستنيين الباقي... 👀</p>`;
  const answered=peers().filter(p=>{const a=p.presence.a;return a&&a.g===s.g&&a.qi===s.qi}).length;
  return `<div class="top"><span class="qcat">${CATS[s.k].e} ${CATS[s.k].t}</span><span>سؤال ${s.qi+1}${s.n?'/'+s.n:''}</span><span>${rv?'':`⏱ <b id="tsec">${DUR}</b>`}</span></div>
  ${s.m>1?`<div class="banner">${s.m===3?'🎰 السؤال الأخير — النقط ×3!':'🔥 سؤال دبل — النقط ×2!'}</div>`:''}
  ${rv?'':`<div class="timer"><i id="tbar" style="width:${Math.max(0,DUR*1000-(Date.now()-localStart))/(DUR*10)}%"></i></div>`}
  ${promptHTML(q)}${optsHTML(q,{picked:myAns&&myAns.qi===s.qi?myAns.i:-1,reveal:rv,fn:'answer'})}
  ${rv?'':`<p class="note">جاوب ${answered} من ${peers().length}</p>`}${res}`;
}
function onlineEnd(){
  const s=st();const rows=Object.values(s.sc||{}).sort((a,b)=>b[1]-a[1]);
  return `<div class="big-emoji">🏆</div><h1 style="font-size:30px">${rows[0]?esc(rows[0][0])+' كسب!':'خلصت!'}</h1>
  <div class="card">${scoreList(s.sc,false)}</div>
  ${isHost?`<button class="btn g" onclick="hostAgain()">العب تاني 🔁</button>`:'<p class="note">المضيف يقدر يبدأ جولة جديدة</p>'}
  <button class="btn ghost" onclick="leaveRoom()">اخرج من الأوضة</button>`;
}
/* ================== موبايل واحد (تحدي الفرق) ================== */
let L=null,lTimer=null;
function startLocalSetup(){L={teams:['الفريق الأحمر','الفريق الأزرق'],cats:Object.keys(CATS),rounds:5};go('lsetup')}
function lsetup(){
  return `<button class="back" onclick="go('home')">→ رجوع</button><h2>📱 تحدي الفرق</h2>
  <div class="card teams"><h2>الفرق</h2>${L.teams.map((t,i)=>`<input value="${esc(t)}" maxlength="16" oninput="L.teams[${i}]=this.value">`).join('')}
  <div class="row">${L.teams.length<4?`<button class="btn ghost" onclick="L.teams.push('فريق '+(L.teams.length+1));render()">+ فريق</button>`:''}${L.teams.length>2?`<button class="btn ghost" onclick="L.teams.pop();render()">− فريق</button>`:''}</div></div>
  <div class="card"><h2>الفئات</h2>${catPicker(L.cats,'lToggle')}<h2 style="margin-top:16px">أدوار لكل فريق</h2>${nPicker(L.rounds,'lRounds',[3,5,8,0])}
  <p class="note">كل فريق معاه جوكرين: 🔥 دبل و✂️ شيل اتنين<br>🎰 سؤال الكازينو بيظهر فجأة: ×3 لو صح، و−100 لو غلط<br>🕵️ لو فريق غلط، اللي بعده يقدر يسرق السؤال</p>
  <button class="btn g" onclick="lStart()" ${L.cats.length?'':'disabled'}>يلا بينا! 🔥</button></div>${aiBox()}`;
}
function lToggle(k){L.cats=toggleIn(L.cats,k);render()}
function lRounds(n){L.rounds=n;render()}
function lStart(){track('play-quiz-local','أسئلة موبايل واحد');
  L.teams=L.teams.map((t,i)=>t.trim()||'فريق '+(i+1));L.sc=L.teams.map(()=>0);
  L.jk=L.teams.map(()=>({dbl:1,half:1}));warmUp(L.cats);
  L.turn=0;L.total=L.rounds*L.teams.length;go('lturn');
}
const lTeam=()=>L.turn%L.teams.length;
const nextTeam=()=>(L.turn+1)%L.teams.length;
function scoreBox(){return `<div class="card"><h2>النقط</h2><ul class="players">${L.teams.map((t,i)=>`<li><span>${i===lTeam()?'👉 ':''}${esc(t)}<span style="font-size:13px;opacity:.7"> ${L.jk[i].dbl?'🔥':''}${L.jk[i].half?'✂️':''}</span></span><span class="pts">${L.sc[i]}</span></li>`).join('')}</ul></div>`}
function lturn(){
  return `<div class="top"><span>دور ${L.turn+1}${L.total?'/'+L.total:''}</span><button class="back" onclick="go('lend')">إنهاء 🏁</button></div>
  <div class="card" style="text-align:center"><h2 style="font-size:26px;margin-bottom:4px">دور ${esc(L.teams[lTeam()])} 🎯</h2><p class="note">اختاروا الفئة</p>
  <div class="cats">${L.cats.map(k=>`<div class="cat" onclick="lPick('${k}')"><span class="e">${CATS[k].e}</span>${CATS[k].t}</div>`).join('')}
  <div class="cat" onclick="lPick('')"><span class="e">🎲</span>عشوائي</div></div></div>${scoreBox()}`;
}
function lPick(k){
  if(!k)k=L.cats[Math.floor(Math.random()*L.cats.length)];
  L.q=draw(k);
  L.casino=Math.random()<0.2;L.dbl=false;L.hide=[];L.pick=-1;L.rv=false;L.gain=0;L.steal=null;
  lRun(DUR);go('lq');
}
function lRun(sec){L.start=Date.now();L.dur=sec;clearInterval(lTimer);lTimer=setInterval(()=>{
  if(S.scr!=='lq'||L.rv){clearInterval(lTimer);return}
  const left=Math.max(0,L.dur*1000-(Date.now()-L.start));tickSound(left);const b=$('#tbar');if(b)b.style.width=(left/(L.dur*10))+'%';const t=$('#tsec');if(t)t.textContent=Math.ceil(left/1000);
  if(left<=0)lAnswer(-1);
},250)}
function useDbl(){snd('joker');const j=L.jk[lTeam()];if(!j.dbl||L.pick>=0||L.steal)return;j.dbl=0;L.dbl=true;render()}
function useHalf(){snd('joker');const j=L.jk[lTeam()];if(!j.half||L.pick>=0||L.steal)return;j.half=0;L.hide=shuffle([0,1,2,3].filter(i=>i!==L.q.c)).slice(0,2);render()}
function lAnswer(i){
  if(L.rv)return;const q=L.q;clearInterval(lTimer);
  if(L.steal){ // محاولة السرقة
    L.steal.pick=i;L.rv=true;
    if(i===q.c){L.gain=50;L.sc[L.steal.team]+=50}
    fxResult(i===q.c,i===q.c?50:0);render();return;
  }
  L.pick=i;const ok=i===q.c;fxResult(ok,ok?null:0);
  if(ok){let g=pointsFor(Date.now()-L.start);if(L.dbl)g*=2;if(L.casino)g*=3;L.gain=g;L.sc[lTeam()]+=g;L.rv=true;floatPts('+'+g)}
  else{
    if(L.casino){L.sc[lTeam()]-=100;L.gain=-100}
    if(L.teams.length>1){L.steal={team:nextTeam(),pick:-1,offer:true}}else L.rv=true;
  }
  render();
}
function startSteal(){L.steal.offer=false;L.hide=[...L.hide,L.pick].filter(i=>i>=0);lRun(10);render()}
function skipSteal(){L.rv=true;L.steal.skipped=true;render()}
function lq(){
  const q=L.q,T=L.teams,t=lTeam(),j=L.jk[t];let res='',banner='';
  if(L.casino)banner=`<div class="banner">🎰 سؤال الكازينو! ×3 لو صح… و−100 لو غلط</div>`;
  if(L.dbl)banner+=`<div class="banner" style="background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#2b0f4c">🔥 الدبل شغال!</div>`;
  const stealing=L.steal&&!L.steal.offer&&!L.rv;
  if(L.steal&&L.steal.offer){
    res=`<p class="msg" style="color:var(--r)">${L.pick<0?'الوقت خلص ⏰':'غلط ❌'}${L.gain<0?' (−100)':''}</p>
    <div class="card" style="text-align:center"><h2>🕵️ فرصة سرقة لـ ${esc(T[L.steal.team])}</h2><p class="note">عندكم 10 ثواني، ولو صح تاخدوا 50 نقطة</p>
    <button class="btn o" onclick="startSteal()">هنسرق! 😈</button><button class="btn ghost" onclick="skipSteal()">لأ، عدّوها</button></div>`;
    return head()+banner+promptHTML(q)+`<div style="opacity:.4;pointer-events:none">${optsHTML(q,{hide:L.hide,picked:L.pick})}</div>`+res;
  }
  if(L.rv){
    let m;
    if(L.steal){m=L.steal.skipped?'محدش سرق 🤷':L.steal.pick===q.c?`${esc(T[L.steal.team])} سرقوها! +50 🕵️`:'السرقة فشلت 😅'}
    else m=`صح! +${L.gain} ✅`;
    res=`<p class="msg" style="color:${(L.steal&&L.steal.pick!==q.c)?'var(--r)':'var(--g)'}">${m}</p><button class="btn" onclick="lNext()">${L.total&&L.turn+1>=L.total?'النتيجة 🏆':'التالي ←'}</button>`;
    return head()+banner+promptHTML(q)+optsHTML(q,{reveal:true})+res;
  }
  const jokers=stealing?'':`<div class="jokers"><button class="jk ${j.dbl?'':'used'} ${L.dbl?'on':''}" onclick="useDbl()">🔥 دبل</button><button class="jk ${j.half?'':'used'}" onclick="useHalf()">✂️ شيل اتنين</button></div>`;
  return head()+banner+(stealing?`<div class="banner" style="background:var(--b);color:#2b0f4c">🕵️ ${esc(T[L.steal.team])} بيسرقوا!</div>`:'')+promptHTML(q)+optsHTML(q,{fn:'lAnswer',hide:L.hide})+jokers;
  function head(){const who=stealing?L.steal.team:t;return `<div class="top"><span class="qcat">${CATS[q.k].e} ${CATS[q.k].t}</span><span>${esc(T[who])}</span><span>${L.rv||(L.steal&&L.steal.offer)?'':`⏱ <b id="tsec">${L.dur}</b>`}</span></div>
  ${L.rv||(L.steal&&L.steal.offer)?'':`<div class="timer"><i id="tbar" style="width:${Math.max(0,L.dur*1000-(Date.now()-L.start))/(L.dur*10)}%"></i></div>`}`}
}
function lNext(){L.turn++;go(L.total&&L.turn>=L.total?'lend':'lturn')}
function lend(){
  setTimeout(winFx,200);
  const rows=L.teams.map((t,i)=>[t,L.sc[i]]).sort((a,b)=>b[1]-a[1]);
  const tie=rows[1]&&rows[0][1]===rows[1][1];
  return `<div class="big-emoji">🏆</div><h1 style="font-size:30px">${tie?'تعادل!':esc(rows[0][0])+' كسب!'}</h1>
  <div class="card"><ul class="players board">${rows.map((r,i)=>`<li><span>${['🥇','🥈','🥉'][i]||'•'} ${esc(r[0])}</span><span class="pts">${r[1]}</span></li>`).join('')}</ul></div>
  <button class="btn g" onclick="lStart()">العب تاني 🔁</button><button class="btn ghost" onclick="go('home')">الرئيسية</button>`;
}
(function(){const m=location.hash.match(/^#r-([a-z0-9]{4})$/);if(m){S.prefill=m[1];S.invite=m[1]}})();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
